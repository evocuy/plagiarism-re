version: '3.8'

services:
  # 1. Database PostgreSQL
  db:
    image: postgres:16
    container_name: plagiarism-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: evopuki123
      POSTGRES_DB: plagiarism_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/init:/docker-entrypoint-initdb.d:ro

  # 2. Backend FastAPI
  backend:
    build: ./backend
    container_name: plagiarism-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:evopuki123@db:5432/plagiarism_db
      - APP_ENV=development
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in the Compose environment}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-60}
    depends_on:
      - db
    volumes:
      - ./backend:/app

  # 3. Frontend Next.js
  frontend:
    build: ./frontend
    container_name: plagiarism-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
